
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - SkillConnect</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="register-container">

        <h1>Post a New Job</h1>
        <p>Find the right talent for your company</p>

        <form method="POST" action="/post-job">

            <label>Job Title</label>
            <input type="text" name="job_title" placeholder="e.g. Python Developer" required>

            <label>Company Name</label>
            <input type="text" name="company_name" placeholder="Enter company name" required>

            <label>Job Location</label>
            <input type="text" name="location" placeholder="e.g. Lucknow" required>

            <label>Salary</label>
            <input type="text" name="salary" placeholder="e.g. ₹15,000 - ₹20,000">

            <label>Job Type</label>
            <select name="job_type" required>
                <option value="">Select Job Type</option>
                <option value="Full Time">Full Time</option>
                <option value="Part Time">Part Time</option>
                <option value="Work From Home">Work From Home</option>
                <option value="Internship">Internship</option>
                <option value="Freelance">Freelance</option>
            </select>

            <label>Job Description</label>
            <textarea name="description" placeholder="Describe the job requirements..." rows="6" required></textarea>

            <button type="submit">Publish Job</button>

            <p><a href="/dashboard">Back to Dashboard</a></p>

        </form>

    </div>

</body>
</html>
